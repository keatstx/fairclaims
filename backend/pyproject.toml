[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairclaims-concierge"
version = "0.1.0"
description = "FairClaims AI Concierge — public-facing FAQ-grounded chat for fairclaims.us"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fairclaims_concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
